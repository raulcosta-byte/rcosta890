<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copa 26 Tracker - Group Share</title>
    <style>
        :root { 
            --usa-blue: #002868; --can-red: #ef3340; --mex-green: #006341;
            --bg: #fdfdfd; --card-bg: #ffffff; --text-dark: #222222;
            --have: #2ecc71; --repeat: #f39c12; --danger: #e74c3c;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text-dark); margin: 0; padding-bottom: 140px; }
        .sticky-header { position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        .header { padding: 15px; text-align: center; border-bottom: 5px solid; border-image: linear-gradient(to right, var(--usa-blue), var(--can-red), var(--mex-green)) 1; }
        
        .lock-control { margin-bottom: 10px; }
        .btn-lock { background: #fff5f5; border: 2px solid var(--danger); color: var(--danger); padding: 8px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.85em; }
        .btn-lock.unlocked { border-color: var(--have); color: var(--have); background: #f5fff5; }
        
        #groupDashboard { display: none; background: #f9f9f9; padding: 15px; border-bottom: 1px solid #ddd; max-height: 250px; overflow-y: auto; font-size: 0.8em; }
        .dash-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
        .repeat-panel { background: #f1f1f1; padding: 12px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .progress-container { width: 100%; background: #eee; border-radius: 20px; height: 12px; margin-bottom: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(to right, var(--usa-blue), var(--mex-green)); width: 0%; transition: 0.5s; }
        #stats { font-size: 0.85em; font-weight: 900; margin-bottom: 10px; color: #333; }
        .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-filter { background: white; border: 2px solid #eee; color: #777; padding: 8px 15px; border-radius: 25px; font-size: 0.75em; font-weight: bold; cursor: pointer; }
        .btn-filter.active { background: var(--usa-blue); color: white; border-color: var(--usa-blue); }
        
        .album-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 20px; }
        .section { background: var(--card-bg); width: 320px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 4px solid #eee; transition: 0.3s; }
        .section h2 { margin: 0 0 15px 0; font-size: 0.9rem; border-bottom: 2px solid #f5f5f5; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .flag-img { width: 22px; height: auto; vertical-align: middle; margin-right: 8px; border-radius: 2px; }
        .stickers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .s { background: #f8f9fa; border: 1px solid #e9ecef; padding: 10px 0; text-align: center; border-radius: 6px; font-size: 0.65em; font-weight: 800; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .s.have { background: var(--have) !important; color: white !important; border: none; }
        .s.repeat { background: var(--repeat) !important; color: white !important; border: none; }
        
        .stickers.locked .s { cursor: not-allowed; opacity: 0.85; }
        .group-title { color: var(--usa-blue); font-size: 1.5em; font-weight: 900; text-align: center; padding: 15px 0; text-transform: uppercase; }
        .btn-action { background: #f8f9fa; border: 1px solid #ddd; padding: 6px 12px; border-radius: 6px; font-size: 0.65em; cursor: pointer; font-weight: bold; }
        
        .footer-controls { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 2000; width: 90%; max-width: 500px; }
        .btn-share { flex: 1; color: white; border: none; padding: 15px 10px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 0.8em; text-align: center; }
        #shareBtn { background: var(--repeat); }
        
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="sticky-header">
    <div class="header">
        <div style="font-size: 2.2em; font-weight: 900; line-height: 1; margin-bottom: 10px;"><span style="color: var(--usa-blue);">COPA</span> 26</div>
        <div class="lock-control">
            <button id="lockBtn" class="btn-lock" onclick="toggleLock()">🔒 BLOQUEADO (Leitura)</button>
        </div>
        <div class="progress-container"><div class="progress-bar" id="pb"></div></div>
        <div id="stats">Calculando...</div>
        <div class="backup-controls">
            <button class="btn-action" onclick="toggleDashboard()">DETALHES</button>
            <button class="btn-action" onclick="exportData()">EXPORTAR TXT</button>
            <button class="btn-action" onclick="document.getElementById('fileInput').click()">IMPORTAR TXT</button>
            <input type="file" id="fileInput" accept=".txt,text/plain" onchange="importData(event)">
            <button class="btn-action" onclick="resetData()" style="color:var(--can-red)">ZERAR TUDO</button>
        </div>
    </div>
    <div id="groupDashboard"></div>
    <div class="repeat-panel">
        <input type="text" id="teamSearch" placeholder="🔍 Buscar seleção, grupo ou código..." oninput="render()" style="width: 85%; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none;">
        <div class="filter-bar">
            <button class="btn-filter active" id="fAll" onclick="setFilter('all')">TUDO</button>
            <button class="btn-filter" id="fMissing" onclick="setFilter('missing')">FALTAM</button>
            <button class="btn-filter" id="fRepeats" onclick="setFilter('repeats')">REPETIDAS</button>
        </div>
    </div>
</div>

<div id="mainContent"></div>

<div class="footer-controls">
    <button id="shareBtn" class="btn-share" onclick="generateShareList()">🔄 LISTA REPETIDAS</button>
    <button id="shareAllAlbumBtn" class="btn-share" style="background: var(--mex-green);" onclick="generateFullAlbumList()">📋 TENHO E FALTAM</button>
</div>

<script>
    let isLocked = true;
    let pressTimer;

    const isoToEmoji = {
        "mx": "🇲🇽", "za": "🇿🇦", "kr": "🇰🇷", "cz": "🇨🇿", "ca": "🇨🇦", "ba": "🇧🇦", "qa": "🇶🇦", "ch": "🇨🇭",
        "br": "🇧🇷", "ma": "🇲🇦", "ht": "🇭🇦", "gb-sct": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "us": "🇺🇸", "py": "🇵🇾", "au": "🇦🇺", "tr": "🇹🇷",
        "de": "🇩🇪", "cw": "🇨🇼", "ci": "🇨🇮", "ec": "🇪🇨", "nl": "🇳🇱", "jp": "🇯🇵", "se": "\uD83C\uDDFE\uD83C\uDDEA", "tn": "🇹🇳",
        "be": "🇧🇪", "eg": "🇪🇬", "ir": "🇮🇷", "nz": "🇳🇿", "es": "🇪🇸", "cv": "🇨🇻", "sa": "🇸🇦", "uy": "🇺🇾",
        "fr": "🇫🇷", "sn": "🇸🇳", "iq": "🇮🇶", "no": "🇳🇴", "ar": "🇦🇷", "dz": "🇩🇿", "at": "🇦🇹", "jo": "🇯🇴",
        "pt": "🇵🇹", "cd": "🇨🇩", "uz": "🇺🇿", "co": "🇨🇴", "gb-eng": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "hr": "🇭🇷", "gh": "🇬🇭", "pa": "🇵🇦"
    };

    const albumData = [
        { group: "ESPECIAIS", teams: [
            { name: "We-Are-26", code: "FWC", icon: "🚩", isEmoji: true, range: [0, 0] },
            { name: "Covers", code: "FWC", icon: "🏛️", isEmoji: true, range: [1, 4] },
            { name: "Bola e Países", code: "FWC", icon: "⚽", isEmoji: true, range: [5, 8] },
            { name: "História", code: "FWC", icon: "📜", isEmoji: true, range: [9, 19] },
            { name: "Coca-Cola", code: "CC", icon: "🥤", isEmoji: true, range: [1, 14] }
        ]},
        { group: "GRUPO A", teams: [{ name: "México", code: "MEX", icon: "mx", total: 20 }, { name: "África do Sul", code: "RSA", icon: "za", total: 20 }, { name: "Coreia Sul", code: "KOR", icon: "kr", total: 20 }, { name: "Rep. Tcheca", code: "CZE", icon: "cz", total: 20 }]},
        { group: "GRUPO B", teams: [{ name: "Canadá", code: "CAN", icon: "ca", total: 20 }, { name: "Bósnia", code: "BIH", icon: "ba", total: 20 }, { name: "Catar", code: "QAT", icon: "qa", total: 20 }, { name: "Suíça", code: "SUI", icon: "ch", total: 20 }]},
        { group: "GRUPO C", teams: [{ name: "Brasil", code: "BRA", icon: "br", total: 20 }, { name: "Marrocos", code: "MAR", icon: "ma", total: 20 }, { name: "Haiti", code: "HAI", icon: "ht", total: 20 }, { name: "Escócia", code: "SCO", icon: "gb-sct", total: 20 }]},
        { group: "GRUPO D", teams: [{ name: "EUA", code: "USA", icon: "us", total: 20 }, { name: "Paraguai", code: "PAR", icon: "py", total: 20 }, { name: "Austrália", code: "AUS", icon: "au", total: 20 }, { name: "Turquia", code: "TUR", icon: "tr", total: 20 }]},
        { group: "GRUPO E", teams: [{ name: "Alemanha", code: "GER", icon: "de", total: 20 }, { name: "Curaçao", code: "CUW", icon: "cw", total: 20 }, { name: "Costa do Marfim", code: "CIV", icon: "ci", total: 20 }, { name: "Equador", code: "ECU", icon: "ec", total: 20 }]},
        { group: "GRUPO F", teams: [{ name: "Holanda", code: "NED", icon: "nl", total: 20 }, { name: "Japão", code: "JPN", icon: "jp", total: 20 }, { name: "Suécia", code: "SWE", icon: "se", total: 20 }, { name: "Tunísia", code: "TUN", icon: "tn", total: 20 }]},
        { group: "GRUPO G", teams: [{ name: "Bélgica", code: "BEL", icon: "be", total: 20 }, { name: "Egito", code: "EGY", icon: "eg", total: 20 }, { name: "Irã", code: "IRN", icon: "ir", total: 20 }, { name: "N. Zelândia", code: "NZL", icon: "nz", total: 20 }]},
        { group: "GRUPO H", teams: [{ name: "Espanha", code: "ESP", icon: "es", total: 20 }, { name: "Cabo Verde", code: "CPV", icon: "cv", total: 20 }, { name: "Arábia S.", code: "KSA", icon: "sa", total: 20 }, { name: "Uruguai", code: "URU", icon: "uy", total: 20 }]},
        { group: "GRUPO I", teams: [{ name: "França", code: "FRA", icon: "fr", total: 20 }, { name: "Senegal", code: "SEN", icon: "sn", total: 20 }, { name: "Iraque", code: "IRQ", icon: "iq", total: 20 }, { name: "Noruega", code: "NOR", icon: "no", total: 20 }]},
        { group: "GRUPO J", teams: [{ name: "Argentina", code: "ARG", icon: "ar", total: 20 }, { name: "Argélia", code: "ALG", icon: "dz", total: 20 }, { name: "Áustria", code: "AUT", icon: "at", total: 20 }, { name: "Jordânia", code: "JOR", icon: "jo", total: 20 }]},
        { group: "GRUPO K", teams: [{ name: "Portugal", code: "POR", icon: "pt", total: 20 }, { name: "RD Congo", code: "COD", icon: "cd", total: 20 }, { name: "Uzbequistão", code: "UZB", icon: "uz", total: 20 }, { name: "Colômbia", code: "COL", icon: "co", total: 20 }]},
        { group: "GRUPO L", teams: [{ name: "Inglaterra", code: "ENG", icon: "gb-eng", total: 20 }, { name: "Croácia", code: "CRO", icon: "hr", total: 20 }, { name: "Gana", code: "GHA", icon: "gh", total: 20 }, { name: "Panamá", code: "PAN", icon: "pa", total: 20 }]}
    ];

    let db = JSON.parse(localStorage.getItem('copa2026_vFinal_Fixed')) || {};
    let currentFilter = 'all';

    function save() { localStorage.setItem('copa2026_vFinal_Fixed', JSON.stringify(db)); render(); }
    
    function toggleLock() {
        isLocked = !isLocked;
        const btn = document.getElementById('lockBtn');
        if(isLocked) {
            btn.innerText = "🔒 BLOQUEADO (Leitura)";
            btn.classList.remove('unlocked');
        } else {
            btn.innerText = "🔓 DESBLOQUEADO (Edição)";
            btn.classList.add('unlocked');
        }
        render();
    }

    function handleClick(id) {
        if(isLocked) return;
        if (!db[id]) { db[id] = 'have'; } 
        else if (db[id] === 'have') { db[id] = 'repeat'; } 
        else if (db[id] === 'repeat') { db[id] = 'have'; }
        save();
    }

    function handleLongPress(id) {
        if(isLocked) return;
        if (db[id]) {
            delete db[id];
            save();
            if (navigator.vibrate) navigator.vibrate(50);
        }
    }

    function startPress(id) { pressTimer = window.setTimeout(() => handleLongPress(id), 800); }
    function endPress(id, e) { clearTimeout(pressTimer); }

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        document.getElementById('f' + f.charAt(0).toUpperCase() + f.slice(1)).classList.add('active');
        render();
    }
    
    function toggleDashboard() { const d = document.getElementById('groupDashboard'); d.style.display = (d.style.display === 'block') ? 'none' : 'block'; }
    
    function exportData() {
        const data = btoa(JSON.stringify(db));
        const blob = new Blob([data], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-album-copa26.txt`;
        a.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(f) { 
            try { 
                let rawContent = f.target.result.trim();
                if (rawContent.includes(',')) rawContent = rawContent.split(',')[1];
                db = JSON.parse(atob(rawContent)); 
                save(); 
                alert("Importado com sucesso! 🏆");
                location.reload(); 
            } catch(err){ alert("Erro ao importar!"); } 
        };
        reader.readAsText(file);
    }

    function resetData() { if(confirm("Deseja ZERAR TODA a sua lista?")) {db={};save();location.reload();}}

    function generateShareList() {
        let reps = [];
        for (let id in db) { if (db[id] === 'repeat') reps.push(id); }
        if (reps.length === 0) { alert("Nenhuma repetida para trocar."); return; }
        let text = `⚽ *REPETIDAS - COPA 26*\n──────────────────\n🔥 Tenho *${reps.length}* figurinhas para troca!\n\n${reps.sort().join(", ")}\n\n_Gerado por Copa Tracker 26_ 🏆`;
        navigator.clipboard.writeText(text).then(() => { alert("Lista copiada! 🚀"); });
    }

    // 📋 FUNÇÃO REVISADA: ORGANIZA EM GRUPOS NA ORDEM FÍSICA DO ÁLBUM
    function generateFullAlbumList() {
        let totalHavesCount = 0;
        let totalMissingsCount = 0;
        
        let haveText = "";
        let missingText = "";

        albumData.forEach(g => {
            let groupHaveLines = [];
            let groupMissingLines = [];

            g.teams.forEach(team => {
                let teamHaves = [];
                let teamMissings = [];
                let flagEmoji = team.isEmoji ? team.icon : (isoToEmoji[team.icon] || "🏳️");

                let stickerIds = [];
                if(team.custom) { team.custom.forEach(c => stickerIds.push(`${team.code} ${c}`)); }
                else if (team.range) { for(let i = team.range[0]; i <= team.range[1]; i++) { stickerIds.push(`${team.code} ${i<10?'0'+i:i}`); } }
                else { for(let i = 1; i <= team.total; i++) { stickerIds.push(`${team.code} ${i<10?'0'+i:i}`); } }

                stickerIds.forEach(id => {
                    if (db[id] === 'have' || db[id] === 'repeat') {
                        teamHaves.push(id);
                        totalHavesCount++;
                    } else {
                        teamMissings.push(id);
                        totalMissingsCount++;
                    }
                });

                if(teamHaves.length > 0) {
                    groupHaveLines.push(`${flagEmoji} *${team.name}:* ${teamHaves.join(", ")}`);
                }
                if(teamMissings.length > 0) {
                    groupMissingLines.push(`${flagEmoji} *${team.name}:* ${teamMissings.join(", ")}`);
                }
            });

            // Se esse grupo contiver alguma figurinha que eu "Tenho", cria o cabeçalho dele
            if(groupHaveLines.length > 0) {
                haveText += `\n── *${g.group}* ──\n` + groupHaveLines.join("\n") + "\n";
            }
            // Se esse grupo contiver alguma figurinha que me "Falta", cria o cabeçalho dele
            if(groupMissingLines.length > 0) {
                missingText += `\n── *${g.group}* ──\n` + groupMissingLines.join("\n") + "\n";
            }
        });

        let text = `📋 *STATUS DO ÁLBUM - COPA 26*\n──────────────────\n\n`;
        
        text += `✅ *JÁ TENHO (${totalHavesCount}):*\n`;
        text += totalHavesCount > 0 ? haveText : "\nNenhuma ainda 😢\n";
        
        text += `\n──────────────────\n\n`;
        
        text += `❌ *ME FALTAM (${totalMissingsCount}):*\n`;
        text += totalMissingsCount > 0 ? missingText : "\nÁLBUM COMPLETO! 🎉\n";
        
        text += `\n_Gerado por Copa Tracker 26_ 🏆`;

        navigator.clipboard.writeText(text).then(() => {
            alert("Copa Tracker 26 diz:\n\nLista organizada por GRUPOS copiada com sucesso! Pronta para mandar pro whats. 📋🔥");
        });
    }

    function render() {
        const main = document.getElementById('mainContent');
        const dash = document.getElementById('groupDashboard');
        const searchTerm = (document.getElementById('teamSearch').value || "").toLowerCase();
        
        main.innerHTML = ''; dash.innerHTML = '<strong>Progresso por Grupo:</strong>';
        let total = 0, haveCount = 0, repArr = [];

        albumData.forEach(g => {
            let gTotal = 0, gHave = 0, groupVisible = false;
            const grid = document.createElement('div'); 
            grid.className = 'album-grid';
            const groupMatchesSearch = g.group.toLowerCase().includes(searchTerm);

            g.teams.forEach(team => {
                let tHave = 0, tHtml = "", tTotalInSec = 0;
                const teamMatchesSearch = team.name.toLowerCase().includes(searchTerm) || team.code.toLowerCase().includes(searchTerm);
                let stickerIds = [];
                if(team.custom) { team.custom.forEach(c => stickerIds.push(`${team.code} ${c}`)); }
                else if (team.range) { for(let i = team.range[0]; i <= team.range[1]; i++) { stickerIds.push(`${team.code} ${i<10?'0'+i:i}`); } }
                else { for(let i = 1; i <= team.total; i++) { stickerIds.push(`${team.code} ${i<10?'0'+i:i}`); } }

                stickerIds.forEach(id => {
                    total++; gTotal++; tTotalInSec++;
                    const status = db[id] || '';
                    if(status !== '') { haveCount++; gHave++; tHave++; }
                    if(status === 'repeat') repArr.push(id);
                    let showFilter = (currentFilter === 'all') || (currentFilter === 'missing' && status === '') || (currentFilter === 'repeats' && status === 'repeat');
                    if(showFilter && (groupMatchesSearch || teamMatchesSearch)) { 
                        groupVisible = true; 
                        tHtml += `<div class="s ${status}" 
                                    onmousedown="startPress('${id}')" 
                                    onmouseup="endPress('${id}')" 
                                    onmouseleave="endPress('${id}')"
                                    ontouchstart="startPress('${id}')" 
                                    ontouchend="endPress('${id}')"
                                    onclick="handleClick('${id}')">${id}</div>`; 
                    }
                });

                if(tHtml !== "") {
                    const sec = document.createElement('div'); sec.className = 'section';
                    let iconHtml = (team.isEmoji) ? `<span style="margin-right:8px; font-size:1.2em;">${team.icon}</span>` : `<img class="flag-img" src="https://flagcdn.com/w40/${team.icon}.png">`;
                    sec.innerHTML = `<h2><span>${iconHtml} ${team.name}</span> <span class="team-count ${tHave===tTotalInSec?'complete':''}">${tHave}/${tTotalInSec}</span></h2><div class="stickers ${isLocked ? 'locked' : ''}">${tHtml}</div>`;
                    grid.appendChild(sec);
                }
            });
            dash.innerHTML += `<div class="dash-item"><span>${g.group}</span><strong>${gTotal > 0 ? ((gHave/gTotal)*100).toFixed(0) : 0}%</strong></div>`;
            if(groupVisible) {
                const title = document.createElement('div'); title.className = 'group-title'; title.innerText = g.group;
                main.appendChild(title); main.appendChild(grid);
            }
        });
        
        let p = (total > 0) ? (haveCount/total*100).toFixed(1) : 0;
        document.getElementById('pb').style.width = p + "%";
        document.getElementById('stats').innerText = `${haveCount} / ${total} FIGURINHAS (${p}%) | REPETIDAS: ${repArr.length}`;
    }
    render();
</script>
</body>
</html>
